<!DOCTYPE html>
<html lang="en">
<head>
	<base target="_top">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	
	<title>Mobile Park Asset Collection</title>
	
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
	
    <style>
		html, body {
			height: 100%;
			margin: 0;
		}
		.leaflet-container {
			height: 400px;
			width: 600px;
			max-width: 100%;
			max-height: 100%;
		}
        /* Custom style to remove the label background */
        .no-background-tooltip {
            background: none;
            border: none;
            box-shadow: none;
            color: black; /* Optional: Set text color */
            font-weight: bold; /* Optional: Make text bold */
        }
	</style>

	<style>body { padding: 0; margin: 0; } #map { height: 100%; width: 100vw; }</style>
</head>
<body>

<div id='map'></div>

<script>
	const map = L.map('map', {
        center: [44.038889, -88.741667],
        zoom: 15
    })

    var baseMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        //attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
        opacity: .5
    });

    baseMap.addTo(map);
    // Feature group to store drawn features
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // Add Leaflet Draw controls
    const drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems
        },
        draw: {
            polygon: false,
            polyline: false,
            rectangle: false,
            circle: false,
            marker: true,
            circlemarker: false
        }
    });
    map.addControl(drawControl);

    // Add a custom button to zoom to the user's location
    const locateControl = L.control({ position: 'topright' });

    locateControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control leaflet-control-custom');
        div.innerHTML = '<button title="Zoom to Current Location" style="background-color: white; border: none; padding: 5px; cursor: pointer;">📍</button>';
        div.onclick = function () {
            // Trigger location detection and zoom to the user's location
            map.locate({ setView: true, maxZoom: 16 });
        };
        return div;
    };

    locateControl.addTo(map);

    // Handle location found event
    map.on('locationfound', function (e) {
        const radius = e.accuracy / 2;

        // Add a marker and circle to indicate the user's location
        L.marker(e.latlng).addTo(map)
            .bindPopup(`You are within ${radius} meters from this point`).openPopup();

        L.circle(e.latlng, radius).addTo(map);
    });

    // Handle location error event
    map.on('locationerror', function (e) {
        alert(`Location error: ${e.message}`);
    });


    // Handle the creation of new features
    map.on('draw:created', function (e) {
    const layer = e.layer;
    const geojson = layer.toGeoJSON();

    // Prompt the user for a name or other properties
    const name = prompt("Enter a name for this marker:");
    if (name) {
        // Add the name as a property to the GeoJSON object
        geojson.properties = {
            name: name
        };

        // Style the marker to match the park assets
        const styledLayer = L.circleMarker(layer.getLatLng(), {
            radius: 6,
            fillColor: "red",
            color: "red",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.8
        });

        // Add the styled marker to the map
        styledLayer.addTo(drawnItems);

        // Send the new feature to the server
        fetch('/api/parkassets', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(geojson)
        })
        .then(response => response.json())
        .then(data => {
            console.log('Feature created:', data);

            // Attach the asset_id returned from the server to the layer
            styledLayer.feature = geojson;
            styledLayer.feature.properties.asset_id = data.id;
        })
        .catch(error => console.error('Error creating feature:', error));
    } else {
        alert("Marker creation canceled. No name provided.");
    }
});

map.on('draw:edited', function (e) {
    const layers = e.layers;
    layers.eachLayer(function (layer) {
        const geojson = layer.toGeoJSON();

        // Ensure the feature has an asset_id
        if (!geojson.properties || !geojson.properties.asset_id) {
            console.error('Feature is missing asset_id');
            return;
        }

        // Send the updated feature to the server
        fetch('/api/parkassets', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(geojson)
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(data => {
            console.log('Feature updated:', data);
        })
        .catch(error => console.error('Error updating feature:', error));
    });
});

map.on('draw:deleted', function (e) {
    const layers = e.layers;
    layers.eachLayer(function (layer) {
        const geojson = layer.toGeoJSON();

        // Ensure the feature has an asset_id
        if (!geojson.properties || !geojson.properties.asset_id) {
            console.error('Feature is missing asset_id');
            return;
        }

        // Send the delete request to the server
        fetch('/api/parkassets', {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ asset_id: geojson.properties.asset_id })
        })
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.text();
        })
        .then(data => {
            console.log('Feature deleted:', data);
        })
        .catch(error => console.error('Error deleting feature:', error));
    });
});

   // Load and add park boundaries from the database to the map
    fetch('/api/parks')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: function (feature) {
                    return { color: "green", fillColor: "green", fillOpacity: 0.25 };
                },
                onEachFeature: function (feature, layer) {
                    if (feature.properties && feature.properties.name) {
                        layer.bindTooltip(feature.properties.name, { 
                            permanent: true, 
                            direction: "center", 
                            className: "no-background-tooltip" // Apply custom class
                        });
                    }
                }
            }).addTo(map);
        })
        .catch(error => console.error('Error loading park boundaries:', error));

// Load and add park assets from the database to the map
fetch('/api/parkassets')
    .then(response => response.json())
    .then(data => {
        const geoJsonLayer = L.geoJSON(data, {
            pointToLayer: function (feature, latlng) {
                // Style park assets as red points
                return L.circleMarker(latlng, {
                    radius: 6,
                    fillColor: "red",
                    color: "red",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                });
            },
            onEachFeature: function (feature, layer) {
                // Replace label with a popup
                if (feature.properties && feature.properties.name) {
                    layer.bindPopup(`<b>Name: ${feature.properties.name}</b><br>Asset ID: ${feature.properties.asset_id}`, {
                        closeButton: true,
                        className: "no-background-tooltip" // Apply custom class
                    });
                }

                // Store the asset_id in the layer for future reference
                layer.feature = feature; // Attach the full feature to the layer
            }
        });

        // Add the loaded features to the drawnItems group
        geoJsonLayer.eachLayer(function (layer) {
            drawnItems.addLayer(layer);
        });
    })
    .catch(error => console.error('Error loading park assets:', error));


</script>



</body>
</html>
